name: publish-custom
run-name: "Build Electron packages"

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  build-electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform_flag: --linux
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform_flag: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Get Version from package.json
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./packages/desktop-electron/package.json').version)")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install apt deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install

      - name: Build OpenCode CLI
        run: bun script/build-node.ts
        working-directory: packages/opencode
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Prepare Desktop App
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop-electron
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Build Electron App
        run: |
          rm -rf out || true
          bun run build
        working-directory: packages/desktop-electron
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Verify Build Output
        working-directory: packages/desktop-electron
        run: |
          echo "=== Checking output directory ==="
          ls -la out/main/index.js || exit 1

      - name: Package Electron
        run: npx electron-builder ${{ matrix.platform_flag }} --publish never --config electron-builder.config.ts --config.asar=false
        working-directory: packages/desktop-electron
        timeout-minutes: 60
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-electron-${{ matrix.os }}
          path: packages/desktop-electron/dist/

  create-release:
    needs: build-electron
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opencode-electron-*
          path: release-assets
          merge-multiple: true

      - name: Get Version
        id: version
        run: echo "VERSION=$(node -e "console.log(require('./packages/desktop-electron/package.json').version)")" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
